name: Verify and deploy ManatureAI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manatureai-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  COMPOSE_PROJECT_NAME: manatureai
  COMPOSE_SERVICE: manatureai
  PUBLIC_BASE_URL: https://manatureai.com
  VERIFICATION_FILE: googleefaa51ff78d78aac.html

jobs:
  verify:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Verify production build
        run: npm run build

      - name: Build the production container image
        run: docker build --tag manatureai:ci .

      - name: Verify Search Console file in the final image
        run: |
          set -Eeuo pipefail
          expected='google-site-verification: googleefaa51ff78d78aac.html'
          actual="$(docker run --rm --entrypoint cat manatureai:ci "/app/public/${VERIFICATION_FILE}")"
          test "$actual" = "$expected"

  deploy:
    name: Deploy the verified commit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_PORT"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_DEPLOY_DIR"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          [[ "$VPS_DEPLOY_DIR" = /* ]]
          test "$VPS_DEPLOY_DIR" != "/"

          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/manatureai_deploy"

          key_error() {
            echo "::error::VPS_SSH_KEY $1 Paste the entire private key file (from -----BEGIN through -----END) into the secret. See DEPLOYMENT.md section 6." >&2
            exit 1
          }

          # Normalise common paste damage without ever printing the key:
          # Windows line endings, surrounding quotes, literal "\n" sequences,
          # and line breaks flattened into spaces. Blank lines around the key
          # are dropped.
          ssh_key="$(printf '%s' "$VPS_SSH_KEY" | tr -d '\r')"
          ssh_key="${ssh_key#"${ssh_key%%[![:space:]]*}"}"
          ssh_key="${ssh_key%"${ssh_key##*[![:space:]]}"}"
          if [[ ${#ssh_key} -ge 2 && ( "$ssh_key" == \"*\" || "$ssh_key" == \'*\' ) ]]; then
            ssh_key="${ssh_key:1:${#ssh_key}-2}"
          fi
          if [[ "$ssh_key" != *$'\n'* && "$ssh_key" == *'\n'* ]]; then
            ssh_key="${ssh_key//\\n/$'\n'}"
          fi
          if [[ "$ssh_key" != *$'\n'* && "$ssh_key" =~ ^[[:space:]]*(-----BEGIN [A-Z0-9 ]+-----)[[:space:]]+(.+)[[:space:]]+(-----END [A-Z0-9 ]+-----)[[:space:]]*$ ]]; then
            ssh_key="${BASH_REMATCH[1]}"$'\n'"$(printf '%s' "${BASH_REMATCH[2]}" | tr -s ' ' '\n')"$'\n'"${BASH_REMATCH[3]}"
          fi
          ssh_key="$(printf '%s\n' "$ssh_key" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed -e '/./,$!d')"

          first_line="$(printf '%s\n' "$ssh_key" | head -n 1)"
          last_line="$(printf '%s\n' "$ssh_key" | tail -n 1)"
          case "$first_line" in
            PuTTY-User-Key-File-*) key_error 'is a PuTTY .ppk key. Export it in OpenSSH format (PuTTYgen > Conversions > Export OpenSSH key).' ;;
            ssh-*|ecdsa-*) key_error 'contains a public key. It must contain the private key (the file without .pub).' ;;
            -----BEGIN*PRIVATE\ KEY-----) ;;
            *) key_error 'does not start with a -----BEGIN ... PRIVATE KEY----- line.' ;;
          esac
          [[ "$last_line" == -----END*PRIVATE\ KEY----- ]] || key_error 'does not end with a -----END ... PRIVATE KEY----- line, so it was probably cut off when pasted.'

          (umask 077 && printf '%s\n' "$ssh_key" > "$key_file")
          chmod 600 "$key_file"
          unset ssh_key

          # Derive the public key into a pipe (never printed) to prove the key loads.
          if ! keygen_error="$(ssh-keygen -y -P '' -f "$key_file" 2>&1 >/dev/null)"; then
            case "$keygen_error" in
              *passphrase*) key_error 'is protected by a passphrase. GitHub Actions cannot type it; use a dedicated key created with an empty passphrase (-N "").' ;;
              *) key_error 'could not be loaded by ssh-keygen (invalid or damaged key data).' ;;
            esac
          fi
          key_fingerprint="$(ssh-keygen -y -P '' -f "$key_file" | ssh-keygen -l -E sha256 -f - | awk '{print $2}')"
          echo "Deploy key loaded. Its fingerprint, which must match a line in ~/.ssh/authorized_keys of VPS_USER on the VPS: $key_fingerprint"

          # Pin the key under a fixed alias (used with HostKeyAlias below) so the
          # host field in VPS_KNOWN_HOSTS does not have to match VPS_HOST exactly.
          # Accepts either "<host> <type> <key>" or "<type> <key>".
          key_line="$(printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' | grep -Ev '^[[:space:]]*(#|$)' | head -n 1 || true)"
          read -r field1 field2 field3 _ <<< "$key_line" || true
          if [[ "${field1:-}" =~ ^(ssh-|ecdsa-) ]]; then
            key_type="$field1"; key_data="${field2:-}"
          else
            key_type="${field2:-}"; key_data="${field3:-}"
          fi
          if [[ ! "$key_type" =~ ^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|ssh-rsa)$ ]] || [[ ! "$key_data" =~ ^[A-Za-z0-9+/]+=*$ ]]; then
            echo '::error::VPS_KNOWN_HOSTS is not a valid host-key line. Paste the full "<host> ssh-ed25519 AAAA..." line, not the SHA256 fingerprint.' >&2
            exit 1
          fi
          printf 'manatureai-vps %s %s\n' "$key_type" "$key_data" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -lf "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo '::error::VPS_KNOWN_HOSTS contains a malformed public key. Copy the line again from ssh-keyscan.' >&2
            exit 1
          fi

      - name: Check SSH access to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          key_file="$HOME/.ssh/manatureai_deploy"
          if ssh_error="$(ssh \
            -i "$key_file" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=manatureai-vps \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" true 2>&1 >/dev/null)"; then
            echo 'SSH authentication to the VPS succeeded.'
            exit 0
          fi

          # ssh's own stderr never contains key material; secrets in it are masked by GitHub.
          key_fingerprint="$(ssh-keygen -y -P '' -f "$key_file" | ssh-keygen -l -E sha256 -f - | awk '{print $2}')"
          case "$ssh_error" in
            *'Host key verification failed'*|*'REMOTE HOST IDENTIFICATION HAS CHANGED'*)
              message='The VPS host key does not match VPS_KNOWN_HOSTS. Confirm the host key through the Hostinger console before updating the secret (DEPLOYMENT.md section 6).' ;;
            *'Permission denied'*)
              message="The VPS rejected the deploy key. Add the public key with fingerprint $key_fingerprint to ~/.ssh/authorized_keys of VPS_USER (mode 600, ~/.ssh mode 700), and check that VPS_USER is correct." ;;
            *'error in libcrypto'*|*'invalid format'*)
              message='ssh could not load the deploy key. Replace VPS_SSH_KEY with the full OpenSSH private key (DEPLOYMENT.md section 6).' ;;
            *'timed out'*|*'Connection refused'*|*'No route to host'*|*'Could not resolve'*)
              message='The VPS SSH port could not be reached. Check VPS_HOST, VPS_PORT and the VPS firewall.' ;;
            *)
              message='SSH to the VPS failed for an unrecognised reason; see the ssh output above.' ;;
          esac
          printf '%s\n' "$ssh_error" >&2
          echo "::error::$message" >&2
          exit 1

      - name: Update and deploy only ManatureAI
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/manatureai_deploy" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=manatureai-vps \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" \
            bash -se -- \
            "$GITHUB_SHA" \
            "$VPS_DEPLOY_DIR" \
            "$COMPOSE_PROJECT_NAME" \
            "$COMPOSE_SERVICE" \
            "$VERIFICATION_FILE" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          # Everything is defined as functions and started by the final "main"
          # line, so bash has read the whole script from stdin before any command
          # runs. Otherwise a command that reads stdin (docker compose exec) could
          # swallow the rest of the script, including the rollback.

          current_step='Starting the remote deployment'

          step() {
            current_step="$1"
            echo "==> $1"
          }

          fail() {
            echo "::error::$current_step failed: $1" >&2
            exit 1
          }

          on_error() {
            local status=$?
            echo "::error::$current_step failed (exit $status at remote line $1): $2" >&2
          }

          wait_until_ready() {
            local attempt
            for attempt in $(seq 1 30); do
              if docker compose -p "$compose_project" exec -T "$compose_service" \
                node -e "Promise.all([fetch('http://127.0.0.1:3000/'), fetch('http://127.0.0.1:3000/$verification_file')]).then(async ([home, verification]) => { const body = (await verification.text()).trim(); if (!home.ok || !verification.ok || body !== 'google-site-verification: $verification_file') process.exit(1) }).catch(() => process.exit(1))" \
                </dev/null; then
                echo "Readiness check passed on attempt $attempt."
                return 0
              fi
              sleep 2
            done
            return 1
          }

          main() {
            expected_sha="$1"
            deploy_dir="$2"
            compose_project="$3"
            compose_service="$4"
            verification_file="$5"
            trap 'on_error "$LINENO" "$BASH_COMMAND"' ERR

            step 'Validating deployment inputs'
            [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || fail 'the GitHub commit SHA is not a full 40-character SHA.'
            [[ "$deploy_dir" = /* ]] || fail 'VPS_DEPLOY_DIR must be an absolute path.'
            [[ "$deploy_dir" != "/" ]] || fail 'VPS_DEPLOY_DIR must not be /.'
            [[ "$compose_project" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || fail 'the Compose project name is invalid.'
            [[ "$compose_service" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || fail 'the Compose service name is invalid.'
            echo "Deploying commit $expected_sha (project $compose_project, service $compose_service)."

            step 'Checking the project directory'
            cd -- "$deploy_dir" 2>/dev/null || fail 'VPS_DEPLOY_DIR does not exist or VPS_USER cannot enter it.'
            [ -d .git ] || fail 'VPS_DEPLOY_DIR is not a Git checkout (no .git directory).'
            [ -f .env ] || fail '.env is missing. Create it once on the VPS (DEPLOYMENT.md section 5); the workflow never creates or edits it.'
            [ -f docker-compose.yml ] || fail 'docker-compose.yml is missing from the checkout.'

            step 'Taking the deployment lock'
            if command -v flock >/dev/null 2>&1; then
              exec 9>".git/manatureai-deploy.lock"
              flock -n 9 || fail 'another ManatureAI deployment is already running on the VPS.'
            else
              echo 'flock is not installed; relying on GitHub Actions concurrency only.'
            fi

            step 'Checking that the VPS checkout has no local changes'
            local dirty
            dirty="$(git status --porcelain --untracked-files=all)"
            if [ -n "$dirty" ]; then
              echo 'Uncommitted or untracked files on the VPS:' >&2
              printf '%s\n' "$dirty" >&2
              fail 'the VPS checkout is not clean. Commit, move or remove these files by hand; the workflow never discards local changes.'
            fi

            step 'Fetching origin/main from GitHub'
            local previous_sha
            previous_sha="$(git rev-parse HEAD)"
            echo "VPS checkout is currently at $previous_sha."
            git fetch --prune origin main || fail 'git fetch could not reach GitHub. Check the VPS GitHub deploy key and ~/.ssh/config of VPS_USER (DEPLOYMENT.md section 5).'
            echo "origin/main is at $(git rev-parse origin/main)."

            step 'Moving the checkout to the pushed commit'
            git cat-file -e "$expected_sha^{commit}" 2>/dev/null || fail "commit $expected_sha was not found after fetching origin/main."
            git merge-base --is-ancestor "$expected_sha" origin/main || fail "commit $expected_sha is no longer on origin/main (was main force-pushed?)."
            if [ "$previous_sha" = "$expected_sha" ]; then
              echo 'The checkout is already at the pushed commit.'
            elif git merge-base --is-ancestor "$previous_sha" "$expected_sha"; then
              git merge --ff-only "$expected_sha"
            else
              fail "the VPS checkout ($previous_sha) cannot fast-forward to $expected_sha because it is newer or has diverged. Resolve it by hand; the workflow never rewrites VPS history."
            fi
            [ "$(git rev-parse HEAD)" = "$expected_sha" ] || fail "HEAD is $(git rev-parse HEAD), expected $expected_sha."
            echo "Checkout is at $expected_sha."

            # Checked only after syncing, so files added by the pushed commit are present.
            step 'Checking the Search Console verification file in the new checkout'
            [ -f "public/$verification_file" ] || fail "public/$verification_file is not in commit $expected_sha."

            step 'Validating the Docker Compose configuration'
            docker compose -p "$compose_project" config --quiet

            step 'Checking the existing Traefik network from .env'
            # Use the value exactly as Compose resolved it from .env (quotes,
            # spaces and comments included) instead of re-parsing .env by hand.
            local traefik_network network_containers
            traefik_network="$(docker compose -p "$compose_project" config \
              | sed -n 's/^[[:space:]]*traefik\.docker\.network:[[:space:]]*//p' \
              | head -n 1 | tr -d "\"'\r")"
            [ -n "$traefik_network" ] || fail 'TRAEFIK_NETWORK did not resolve to a value. Set it in .env to the existing Traefik network.'
            case "$traefik_network" in
              *[!A-Za-z0-9_.-]*) fail "TRAEFIK_NETWORK has an invalid value: $traefik_network" ;;
              bridge|host|none) fail "TRAEFIK_NETWORK must be the shared Traefik network, not Docker's built-in $traefik_network network." ;;
            esac
            docker network inspect "$traefik_network" >/dev/null 2>&1 || fail "Docker network $traefik_network does not exist. The workflow never creates networks; fix TRAEFIK_NETWORK in .env."
            network_containers="$(docker network inspect --format '{{range .Containers}}{{.Name}} {{end}}' "$traefik_network")"
            echo "Using the existing network $traefik_network (attached: ${network_containers:-none})."
            case " $network_containers" in
              *traefik*) ;;
              *) echo "::warning::No container named like 'traefik' is attached to $traefik_network. Check TRAEFIK_NETWORK if HTTPS routing fails." >&2 ;;
            esac

            step 'Recording the running release for rollback'
            local previous_container previous_image="" image_ref
            image_ref="$(docker compose -p "$compose_project" config --images "$compose_service" | head -n 1)"
            [ -n "$image_ref" ] || fail "Compose did not report an image name for $compose_service."
            previous_container="$(docker compose -p "$compose_project" ps -q "$compose_service")"
            if [ -n "$previous_container" ]; then
              previous_image="$(docker inspect --format '{{.Image}}' "$previous_container")"
              docker image tag "$previous_image" "${image_ref%%:*}:previous"
              echo "Tagged the running image $previous_image as ${image_ref%%:*}:previous."
            else
              echo 'No running ManatureAI container was found, so a failed release cannot be rolled back.'
            fi

            step "Building only the $compose_service image"
            # Build before touching the running container; a failed build leaves the site as it was.
            if ! docker compose -p "$compose_project" build "$compose_service"; then
              git reset --keep "$previous_sha"
              fail "the Docker build failed. The checkout was returned to $previous_sha and the live site was not changed."
            fi

            step "Restarting only the $compose_service service"
            docker compose -p "$compose_project" up -d --no-build --no-deps "$compose_service"
            docker compose -p "$compose_project" ps "$compose_service"

            step 'Waiting for the new release to pass its readiness check'
            if wait_until_ready; then
              step 'Verifying the running container uses the newly built image'
              local new_container running_image built_image
              new_container="$(docker compose -p "$compose_project" ps -q "$compose_service")"
              [ -n "$new_container" ] || fail 'the ManatureAI container is not running after the restart.'
              running_image="$(docker inspect --format '{{.Image}}' "$new_container")"
              built_image="$(docker image inspect --format '{{.Id}}' "$image_ref")"
              [ "$running_image" = "$built_image" ] || fail "the running container uses image $running_image, but the build produced $built_image."
              echo "Deployed commit $expected_sha as image $built_image."
              exit 0
            fi

            echo 'The new release failed its readiness check. Rolling back.' >&2
            docker compose -p "$compose_project" logs --tail 50 "$compose_service" >&2 || true
            step "Rolling back to $previous_sha"
            git reset --keep "$previous_sha"
            if [ -z "$previous_image" ]; then
              fail 'the new release is not ready and no previous container existed, so there is nothing to roll back to.'
            fi
            docker image tag "$previous_image" "$image_ref"
            docker compose -p "$compose_project" up -d --no-build --no-deps --force-recreate "$compose_service"
            if wait_until_ready; then
              echo "::error::Commit $expected_sha failed its readiness check. Rolled back to $previous_sha; the previous release is serving traffic." >&2
            else
              echo '::error::Rollback completed but the previous release is also failing its readiness check.' >&2
            fi
            exit 1
          }

          main "$@"
          REMOTE_SCRIPT

      - name: Verify the public HTTPS routes
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            --output /dev/null "$PUBLIC_BASE_URL/"
          actual="$(curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "$PUBLIC_BASE_URL/$VERIFICATION_FILE")"
          test "$actual" = 'google-site-verification: googleefaa51ff78d78aac.html'
